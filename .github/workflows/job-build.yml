name: Build

# Reusable: configures and compiles one build MODE (Debug or Release), then
# uploads build/<mode> so the matching unit-test/functional-test jobs can run
# ctest against the already-compiled tree instead of recompiling per job.
# Coverage has its own job (job-coverage.yml) since it also runs the tests
# and collects lcov data in the same step, rather than splitting build/test.

on:
  workflow_call:
    inputs:
      mode:
        description: 'CMAKE_BUILD_TYPE to configure/build (Debug or Release)'
        required: true
        type: string

env:
  # Named modules require Ninja: CMake's Makefile generator does not implement
  # the dyndep scanning protocol modules need, and never will.
  CMAKE_GENERATOR: Ninja

jobs:
  build:
    name: build (${{ inputs.mode }})
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # bats is needed here, not just in job-functional-test.yml: the
      # functional/CMakeLists.txt find_program(BATS_EXECUTABLE bats) call
      # happens at *configure* time, and the functional_* ctest entries are
      # only registered when it succeeds. If bats were missing here, the
      # later functional-test job would find zero functional_* tests to run,
      # no matter how it's provisioned itself.
      - name: Install toolchain
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-15 ninja-build cmake libcurl4-openssl-dev bats

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/${{ inputs.mode }}/_deps
          key: ${{ runner.os }}-deps-gcc15-${{ inputs.mode }}-${{ hashFiles('third_party/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-deps-gcc15-${{ inputs.mode }}-

      - name: Configure
        env:
          CC: gcc-15
          CXX: g++-15
        run: cmake -B build/${{ inputs.mode }} -DCMAKE_BUILD_TYPE=${{ inputs.mode }}

      - name: Build
        run: cmake --build build/${{ inputs.mode }}

      # _deps is excluded: it's third-party sources plus their compiled
      # objects, already restored/rebuilt by the FetchContent cache above --
      # re-uploading and re-downloading them on every test job would balloon
      # artifact transfer for no benefit (the test jobs never touch _deps).
      - name: Upload build tree
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ inputs.mode }}
          path: |
            build/${{ inputs.mode }}
            !build/${{ inputs.mode }}/_deps
          include-hidden-files: true
          retention-days: 1
