name: Build

# Reusable: configures and compiles one build MODE (Debug or Release) with
# one GCC version, then uploads build/<mode> so the matching unit-test/
# functional-test jobs can run ctest against the already-compiled tree
# instead of recompiling per job. Coverage has its own job (job-coverage.yml)
# since it also runs the tests and collects lcov data in the same step,
# rather than splitting build/test.
#
# Runs in `image`, a docker/ci/ubuntu.Dockerfile build from job-ci-images.yml
# that already carries g++-<gcc-version>, cmake, ninja, libcurl and bats (and
# sets CC/CXX), so there is nothing to install. The test jobs downloading this
# build tree must run in the same image: a `container:` job mounts the
# workspace at /__w/..., and every absolute path CMake baked into the tree
# points there.
#
# gcc-version defaults to the floor (15); cpp.yml also calls this at 16 for
# the canary build, structured identically to the Debug/Release pipeline
# (build -> parallel unit-test/functional-test) rather than as a bespoke
# combined job -- continue-on-error is threaded through as an input so the
# canary variant can be non-blocking without a separate job definition.

on:
  workflow_call:
    inputs:
      mode:
        description: 'CMAKE_BUILD_TYPE to configure/build (Debug or Release)'
        required: true
        type: string
      gcc-version:
        description: 'GCC major version the image carries (names the artifact)'
        required: false
        type: string
        default: '15'
      image:
        description: 'CI image to build in (a job-ci-images.yml output matching gcc-version)'
        required: true
        type: string
      continue-on-error:
        description: 'Report failure without failing the overall run (for the gcc-16 canary)'
        required: false
        type: boolean
        default: false
    outputs:
      artifact-name:
        description: Name of the uploaded build-tree artifact
        value: build-${{ inputs.mode }}-gcc${{ inputs.gcc-version }}

env:
  # Named modules require Ninja: CMake's Makefile generator does not implement
  # the dyndep scanning protocol modules need, and never will.
  CMAKE_GENERATOR: Ninja

jobs:
  build:
    name: build (${{ inputs.mode }}, gcc-${{ inputs.gcc-version }})
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    continue-on-error: ${{ inputs.continue-on-error }}

    permissions:
      contents: read
      packages: read

    # A `container:` job's run steps default to sh, not bash (dash on
    # Ubuntu/Debian), so bash-isms like ${GITHUB_SHA::7} need this.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          # This job never pushes back to the repo; leaving the checkout
          # token persisted in .git/config is an avoidable credential-
          # exposure surface (flagged by SonarCloud's githubactions:S8262 --
          # a broad artifact upload downstream, even one scoped to build/,
          # is exactly the kind of step that rule exists to catch).
          persist-credentials: false

      # The image's bats matters here, not just in job-functional-test.yml:
      # functional/CMakeLists.txt's find_program(BATS_EXECUTABLE bats) runs
      # at *configure* time, and the functional_* ctest entries are only
      # registered when it succeeds.

      # Keyed on the image: _deps holds CMake caches that record the absolute
      # path they were configured at (/__w/... in a container), so a cache
      # from another environment fails the configure outright, and objects
      # built by another toolchain shouldn't be reused either.
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/${{ inputs.mode }}/_deps
          key: deps-${{ inputs.image }}-${{ inputs.mode }}-${{ hashFiles('third_party/CMakeLists.txt') }}
          restore-keys: deps-${{ inputs.image }}-${{ inputs.mode }}-

      # CC/CXX come from the image.
      - name: Configure
        run: cmake -B build/${{ inputs.mode }} -DCMAKE_BUILD_TYPE=${{ inputs.mode }}

      - name: Build
        run: cmake --build build/${{ inputs.mode }}

      # _deps is excluded: it's third-party sources plus their compiled
      # objects, already restored/rebuilt by the FetchContent cache above --
      # re-uploading and re-downloading them on every test job would balloon
      # artifact transfer for no benefit (the test jobs never touch _deps).
      - name: Upload build tree
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ inputs.mode }}-gcc${{ inputs.gcc-version }}
          path: |
            build/${{ inputs.mode }}
            !build/${{ inputs.mode }}/_deps
          include-hidden-files: true
          retention-days: 1
