name: Fedora build

# Reusable, non-blocking: proves cup builds and passes its full test suite
# on Fedora, a second officially-supported "build from source" distro
# alongside the ubuntu-24.04 floor (job-coverage.yml/job-build.yml) --
# backing the README's platform claims with an actual CI run instead of
# untested prose. One self-contained job (configure+build+test), matching
# job-coverage.yml's/the gcc-16 canary's shape, rather than a separate
# build/test split: this exists as a compatibility signal, not the primary
# release pipeline, so there's no artifact to share downstream.
#
# fedora:42 ships GCC 15.2 and CMake 3.31 by default -- no PPA-equivalent
# extra repo needed, unlike ubuntu-24.04.

# Runs in job-ci-images.yml's fedora image (docker/ci/fedora.Dockerfile),
# which carries the toolchain and an ordinary `runner` user.

on:
  workflow_call:
    inputs:
      image:
        description: 'CI image to run in (the job-ci-images.yml fedora output)'
        required: true
        type: string

env:
  CMAKE_GENERATOR: Ninja

jobs:
  build-and-test:
    name: fedora 42 — build + test
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    continue-on-error: true

    permissions:
      contents: read
      packages: read

    # A `container:` job's run steps default to sh, not bash (dash on
    # Ubuntu/Debian), so bash-isms like ${GITHUB_SHA::7} need this.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          # This job never pushes back to the repo; no reason to leave the
          # checkout token persisted in .git/config.
          persist-credentials: false

      - name: Show toolchain versions
        run: |
          g++ --version | head -1
          cmake --version | head -1
          ninja --version

      # cmd_test.cpp and build_run.bats each have a scenario that chmod's a
      # directory to 0000 to simulate a permission-denied error and expects
      # the resulting cup operation to fail -- root bypasses permission
      # checks entirely, so those scenarios only mean anything running as an
      # ordinary user. A `container:` job runs as root, so the image carries
      # an ordinary `runner` user; hand it the checked-out workspace.
      - name: Hand the workspace to the non-root user
        run: chown -R runner:runner "$GITHUB_WORKSPACE"

      - name: Configure
        run: su runner -c 'cmake -B build/Debug -G Ninja -DCMAKE_BUILD_TYPE=Debug'

      - name: Build
        run: su runner -c 'cmake --build build/Debug'

      - name: Test
        run: su runner -c 'ctest --test-dir build/Debug --output-on-failure'
