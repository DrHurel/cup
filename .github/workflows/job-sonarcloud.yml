name: SonarCloud

# Reusable: reuses job-coverage.yml's already-built + already-tested
# build/Coverage tree (gcno *and* gcda both present, since that job ran
# ctest) to generate the gcovr report and feed the SonarCloud scan — no
# second configure/build/test cycle. Needs its own g++-15 install anyway:
# CFamily's analyser runs the real compiler to learn its built-in macros and
# include paths (compile_commands.json names /usr/bin/g++-15 outright), and
# gcovr needs the matching gcov-15 to read GCC 15's note/data files.

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  sonarcloud:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history gives SonarCloud accurate blame / new-code detection.
          fetch-depth: 0
          # This job never pushes back to the repo; no reason to leave the
          # checkout token persisted in .git/config.
          persist-credentials: false

      - name: Download the Coverage build
        uses: actions/download-artifact@v4
        with:
          name: build-Coverage
          path: build/Coverage

      - name: Restore executable permissions
        run: chmod -R +x build/Coverage/bin

      - name: Install gcov + gcovr
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-15 gcovr

      # Run from the repository root on purpose: --root decides the paths written
      # into the report, and Sonar keys C++ files as src/... — matching --root .
      # here. Rooting this anywhere else would emit a different prefix and match
      # nothing, which shows up as 0% coverage rather than as an error.
      #
      # gcov-15 must match the compiler; the default `gcov` is GCC 13 on this
      # runner and rejects the notes files. Vendored, generated and test sources
      # are excluded to match sonar.exclusions.
      #
      # The two --exclude-*-branches/lines flags are what make the imported
      # "conditions" mean what Sonar thinks they mean, and without them the gate
      # reads the port as barely covered:
      #
      #   - --exclude-throw-branches. gcov emits a branch pair for *every* call
      #     that could throw — the landing-pad edge — and the port's style is a
      #     dense chain of std::format, std::string and and_then/transform calls,
      #     so this dominates: 951 branches reported for src/libs, of which
      #     287 are exception edges no test can take without forcing bad_alloc.
      #     Sonar counts each as an uncovered condition, which is what put
      #     Toml.cpp at 60% branch coverage while 193 of its 197 real ones are
      #     covered.
      #   - --exclude-noncode-lines. Drops the lines that carry no statement of
      #     their own — a bare `}` whose only instructions are the destructor
      #     calls on an exception path, which gcov reports as an executable line
      #     with a zero count.
      #
      # Together they take coverage on new code from 78% to 98% without a single
      # test changing, so keep them: dropping them does not make the gate
      # stricter, it makes it measure the compiler's exception tables.
      #
      # --gcov-ignore-errors all, not just no_working_dir_found: any TU that
      # imports a named module gets a gcno note pointing at the module's BMI
      # name (e.g. "cup.error") instead of a real path — gcc/gcov has no
      # source file to open for that, so gcov reports it as source_not_found.
      # gcovr 7.0 (what apt installs on noble, and what this job pins via
      # g++-15/gcovr) treats an unignored gcov error as fatal *for that whole
      # translation unit* and drops the file from the report outright, rather
      # than degrading gracefully like 8.x does. That silently deleted
      # src/libs/cup/scaffold/{Cmake,Releases,Render}.cpp from coverage.xml —
      # Sonar then has zero coverage data for them, so every new line in those
      # files reads as uncovered. Measured on this branch: new_coverage went
      # from 59.3% (gate: fail, needs 80%) to 93.1% once source_not_found was
      # ignored too, with no test changes at all.
      #
      # --html-details also lands a browsable per-file report in site/ — the
      # same gcovr run and .gcda data that feeds Sonar, reused rather than
      # captured twice; job-deploy-pages.yml publishes it.
      #
      # The extra `.*/catch2/.*` exclude is only load-bearing for that HTML
      # report: unlike --sonarqube (pure line/branch counts), --html-details
      # opens and embeds each file's source, so it hard-fails instead of
      # degrading when it can't — and around 170 vendored Catch2 files can't
      # be opened, because their .gcno notes carry the same truncated path
      # (missing the _deps/catch2-src/ prefix) the FetchContent-sourced
      # "source" ignore-error above already works around for gcov itself.
      # --exclude '.*/_deps/.*' does not match that truncated form.
      - name: Generate the C++ coverage report
        run: |
          mkdir -p site
          gcovr --root . \
                --gcov-executable gcov-15 \
                --gcov-exclude '.*/_deps/.*' \
                --gcov-ignore-errors all \
                --exclude '.*/_deps/.*' \
                --exclude '.*/generated/.*' \
                --exclude 'src/tests/.*' \
                --exclude '.*/catch2/.*' \
                --exclude-throw-branches \
                --exclude-noncode-lines \
                --sonarqube coverage.xml \
                --html-details site/index.html \
                build/Coverage
          echo "--- coverage.xml head ---"
          head -5 coverage.xml

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: site

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Block the check (and thus the merge) if the SonarCloud quality gate
          # fails on the analysed code. The no-new-issues policy is a condition
          # *on that gate* (new_violations > 0 is an error), not a second check
          # here — see the note in sonar-project.properties.
          args: >
            -Dsonar.qualitygate.wait=true
