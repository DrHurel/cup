name: C++ CI

# Build and test cup — the C++23 port that replaced the original Go
# implementation (see docs/migration-cpp23.md; the Go sources live on in the
# go-legacy branch). Phase 7 flattened what was cpp/ up to the repository
# root, once the Go tree it used to sit alongside was gone.
#
# Everything is built with plain `cmake -G Ninja`, not with cup. That is not an
# oversight — the first C++ cup has no cup to build it, and that bootstrap path is
# the one contributors follow, so CI must exercise it.
#
# This is an orchestrator: every job below (other than the trivial `uses:`
# wiring) lives in its own job-*.yml reusable workflow, one file per job, so
# each can be read/changed in isolation. The graph:
#
#   coverage ──────────────────────────────┬──> sonarcloud ──> deploy-pages (main push only)
#   build-debug ──┬──> unit-test-debug      │
#                 └──> functional-test-debug│
#   build-release ┬──> unit-test-release    │
#         (*)     └──> functional-test-release ──> release-main (main push only)
#   build-deb (*) ──────────────────────────> release-main (main push only)
#   build-canary ─┬──> unit-test-canary (*, non-blocking)
#         (*)     └──> functional-test-canary (*, non-blocking)
#   build-fedora (main push only, non-blocking)
#   build-debian (main push only, non-blocking)
#
# build-fedora/build-debian back the README's "officially supported build-
# from-source distros" claims with a real CI run each, alongside the
# ubuntu-24.04 floor. Main-push only, not gated like (*) below: they're a
# packaging/distribution compatibility signal, not part of the core PR
# feedback loop, so they only need to run once code actually lands on main
# -- also non-blocking (continue-on-error, same as canary) as a second,
# now mostly-redundant layer of caution. Each is one self-contained job
# (configure+build+test, no artifact-sharing split).
#
# build-release *is* the musl-static release artifact (build-static.yml),
# not a separate glibc verification build: cup's real Release output gets
# the exact same unit-test/functional-test coverage Debug does, and
# release.yml (the tag-triggered publisher) and release-main both consume
# this same job's output rather than a redundant fourth build. Its test jobs
# pass container: alpine:3.23 + pm: apk (job-unit-test.yml/
# job-functional-test.yml both accept this) so they run in the same
# container build-release did — a `container:` job mounts the workspace at
# /__w/... rather than the usual /home/runner/work/..., so a plain
# (non-containerized) test job downloading this artifact would find every
# absolute path CTestTestfile.cmake baked in pointing nowhere.
#
# (*) gated on the PR not being a draft — draft PRs only run build-debug and
# coverage, for the fastest possible signal while iterating. Everything else
# starts once the PR is marked ready for review (or unconditionally for a
# plain push/workflow_dispatch, which never carry a `draft` flag).

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'templates/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - 'cup.toml'
      - '.github/workflows/cpp.yml'
      - '.github/workflows/job-*.yml'
      - '.github/workflows/build-static.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'templates/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - 'cup.toml'
      - '.github/workflows/cpp.yml'
      - '.github/workflows/job-*.yml'
      - '.github/workflows/build-static.yml'
  workflow_dispatch:

concurrency:
  group: cpp-${{ github.ref }}
  cancel-in-progress: true
  # Trade-off from folding the old ci.yml's sonar/pages pipeline in here: it
  # previously used a separate `pages-${{ github.ref }}` group with
  # cancel-in-progress: false specifically so a rapid second push to main
  # couldn't interrupt an in-flight Pages deploy. A job that calls a
  # reusable workflow via `uses:` cannot set its own job-level
  # `concurrency:` to restore that split (actionlint rejects it), so a fast
  # double-push to main can now cancel a deploy-pages run mid-flight. Rare
  # in practice (main pushes are infrequent compared to PR iteration), and a
  # cancelled deploy is harmless — the next successful run republishes.

jobs:
  # --- always on, even for a draft PR -----------------------------------
  coverage:
    uses: ./.github/workflows/job-coverage.yml
    permissions:
      contents: read

  build-debug:
    uses: ./.github/workflows/job-build.yml
    with:
      mode: Debug
    permissions:
      contents: read

  unit-test-debug:
    needs: build-debug
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/job-unit-test.yml
    with:
      mode: Debug
      artifact-name: ${{ needs.build-debug.outputs.artifact-name }}
    permissions:
      contents: read

  functional-test-debug:
    needs: build-debug
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/job-functional-test.yml
    with:
      mode: Debug
      artifact-name: ${{ needs.build-debug.outputs.artifact-name }}
    permissions:
      contents: read

  # --- gated: skipped on a draft PR ---------------------------------------
  # The release artifact itself: a musl-static binary built in alpine (see
  # build-static.yml for why musl and why alpine:3.23). This *is*
  # build-release, not a separate verification build alongside it -- cup's
  # actual shippable Release output is what gets tested and packaged.
  build-release:
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/build-static.yml
    permissions:
      contents: read

  unit-test-release:
    needs: build-release
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/job-unit-test.yml
    with:
      mode: Release
      artifact-name: ${{ needs.build-release.outputs.artifact-name }}
      container: alpine:3.23
      pm: apk
    permissions:
      contents: read

  functional-test-release:
    needs: build-release
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/job-functional-test.yml
    with:
      mode: Release
      artifact-name: ${{ needs.build-release.outputs.artifact-name }}
      container: alpine:3.23
      pm: apk
    permissions:
      contents: read

  # The .deb release artifact, alongside build-release's musl-static
  # binary: apt-installable for anyone who'd rather have Debian/Ubuntu
  # manage and remove it the normal way. See job-build-deb.yml for why it
  # links libstdc++/libgcc statically -- the same GLIBCXX version gap
  # unit-test-canary hit, just for package Depends: this time instead of a
  # missing runtime .so.
  build-deb:
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/job-build-deb.yml
    permissions:
      contents: read

  # Early warning against a newer GCC: the exact same build -> parallel
  # unit-test/functional-test shape as Debug/Release, just gcc-16 and
  # continue-on-error: true instead of a bespoke combined job. Non-blocking
  # on purpose: this exists to tell us something, not to gate.
  build-canary:
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/job-build.yml
    with:
      mode: Debug
      gcc-version: '16'
      continue-on-error: true
    permissions:
      contents: read

  unit-test-canary:
    needs: build-canary
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/job-unit-test.yml
    with:
      mode: Debug
      artifact-name: ${{ needs.build-canary.outputs.artifact-name }}
      continue-on-error: true
    permissions:
      contents: read

  functional-test-canary:
    needs: build-canary
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/job-functional-test.yml
    with:
      mode: Debug
      artifact-name: ${{ needs.build-canary.outputs.artifact-name }}
      gcc-version: '16'
      continue-on-error: true
    permissions:
      contents: read

  # Officially-supported "build from source" distros beyond the ubuntu-24.04
  # floor -- each its own self-contained job (see job-build-fedora.yml/
  # job-build-debian.yml for why they don't split into build/test like
  # Debug/Release/Canary). Main-push only, not every PR: these are packaging/
  # distribution compatibility checks, not part of the core PR feedback
  # loop -- back the README's platform claims with a real CI run, but only
  # need to run when code actually lands on main.
  build-fedora:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/job-build-fedora.yml
    permissions:
      contents: read

  build-debian:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/job-build-debian.yml
    permissions:
      contents: read

  sonarcloud:
    needs: coverage
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/job-sonarcloud.yml
    permissions:
      contents: read
    secrets: inherit

  # --- main-push only, regardless of draft (drafts don't merge to main) --
  deploy-pages:
    needs: sonarcloud
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/job-deploy-pages.yml
    permissions:
      pages: write
      id-token: write

  # Packages build-release's musl-static binary and build-deb's .deb into one
  # downloadable bundle for the latest main build — not a GitHub Release
  # (that stays reserved for version tags; see release.yml, which consumes
  # the same build-release/build-deb outputs independently on its own
  # tag-triggered pipeline). Waits on the test jobs too, not just the
  # builds, so main only ever offers artifacts that actually passed suite.
  release-main:
    needs: [build-release, unit-test-release, functional-test-release, build-deb]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/job-release-main.yml
    with:
      artifact-name: ${{ needs.build-release.outputs.artifact-name }}
      deb-artifact-name: ${{ needs.build-deb.outputs.artifact-name }}
    permissions:
      contents: read
