name: C++ CI

# Build and test the C++ port under cpp/, which the Go cup scaffolded and which
# will eventually replace it (see docs/migration-cpp23.md).
#
# This pipeline is deliberately separate from ci.yml: the Go binary must stay
# shippable for the whole migration, so nothing here can affect the Go gate.
#
# Everything is built with plain `cmake -G Ninja`, not with cup. That is not an
# oversight — the first C++ cup has no cup to build it, and that bootstrap path is
# the one contributors follow, so CI must exercise it.

on:
  push:
    branches: [main]
    paths: ['cpp/**', '.github/workflows/cpp.yml']
  pull_request:
    paths: ['cpp/**', '.github/workflows/cpp.yml']
  workflow_dispatch:

concurrency:
  group: cpp-${{ github.ref }}
  cancel-in-progress: true

env:
  # Named modules require Ninja: CMake's Makefile generator does not implement the
  # dyndep scanning protocol modules need, and never will.
  CMAKE_GENERATOR: Ninja

jobs:
  # The compiler floor. cup pins GCC >= 15 / Clang >= 18 (raised from GCC 14 in
  # Phase 4 — see docs/migration-cpp23.md's Phase 4 note: cup.cmd is the first
  # module needing cup.project + cup.scaffold + cup.tmpl + cup.ui + cup.platform
  # all reachable at once, and GCC 14's modules implementation hits a hard,
  # unfixable-in-source limit at that breadth — write_location ICEs and
  # "incomplete type" corruption merging cup.ui's and cup.scaffold's BMIs, not
  # a bug restructuring can route around). Ubuntu 24.04 has no official g++-15
  # package, so this needs the same ubuntu-toolchain-r PPA the canary job below
  # already trusts.
  build-gcc15:
    name: gcc-15 (floor) — build + test + coverage
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-15 ninja-build cmake libcurl4-openssl-dev lcov bats

      - name: Show toolchain versions
        run: |
          g++-15 --version | head -1
          cmake --version | head -1
          ninja --version

      # FetchContent clones toml++ and Catch2 on every configure; cache the
      # populated _deps tree so PRs do not re-clone them each run.
      #
      # Keyed on the compiler too, not just third_party/CMakeLists.txt: _deps
      # holds compiled .gcno/.gcda coverage artifacts, and restoring a cache
      # built by a different GCC (e.g. across the GCC 14 -> 15 floor bump)
      # mixes gcov note/data format versions — geninfo then fails with
      # "stamp mismatch with notes file" / "version 'B42*', prefer 'B52*'"
      # instead of silently reusing a compatible cache. The restore-keys
      # prefix carries the same suffix, or a floor bump would still fall back
      # to the stale entry as a "partial match".
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: cpp/build/Coverage/_deps
          key: ${{ runner.os }}-deps-gcc15-${{ hashFiles('cpp/third_party/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-deps-gcc15-

      # Coverage is a first-class build mode in a cup project, so the gcov run is
      # the same build the tests run against — no second configure.
      - name: Configure (Coverage)
        working-directory: cpp
        env:
          CC: gcc-15
          CXX: g++-15
        run: cmake -B build/Coverage -DCMAKE_BUILD_TYPE=Coverage

      - name: Build
        working-directory: cpp
        run: cmake --build build/Coverage

      # No --no-tests=ignore: Phase 2 landed the ui, tmpl and project suites, so a
      # run that discovers no tests means the wiring broke and must fail loudly.
      - name: Test
        working-directory: cpp
        run: ctest --test-dir build/Coverage --output-on-failure

      - name: Collect coverage
        working-directory: cpp
        run: |
          # `source` is not optional: some .gcda name Catch2 headers by a path that
          # does not resolve in the build tree (build/Coverage/src/catch2/reporters/
          # catch_reporter_sonarqube.hpp), and geninfo treats an unopenable source as a
          # hard error. Excluding _deps at capture also skips ~100 Catch2 objects that
          # the --remove below would drop anyway.
          lcov --capture --directory build/Coverage --output-file coverage.info \
               --gcov-tool gcov-15 --exclude '*/_deps/*' \
               --ignore-errors empty,mismatch,source
          # Third-party and generated sources are not ours to cover.
          lcov --remove coverage.info \
               '/usr/*' '*/build/*/_deps/*' '*/build/*/generated/*' \
               --output-file coverage.info --ignore-errors empty,unused
          lcov --list coverage.info

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: cpp-coverage
          path: |
            cpp/coverage.info
            cpp/build/Coverage/compile_commands.json

  # Early warning against a newer GCC. Module support moves fast, and an ICE or a
  # stale-BMI bug should surface here rather than in a contributor's first PR.
  # Non-blocking on purpose: this job exists to tell us something, not to gate.
  build-gcc-latest:
    name: gcc-16 (canary) — build + test
    runs-on: ubuntu-24.04
    continue-on-error: true

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-16 ninja-build cmake libcurl4-openssl-dev bats

      - name: Configure
        working-directory: cpp
        env:
          CC: gcc-16
          CXX: g++-16
        run: cmake -B build/Debug -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        working-directory: cpp
        run: cmake --build build/Debug

      - name: Test
        working-directory: cpp
        run: ctest --test-dir build/Debug --output-on-failure

  # The release artifact: a musl-static binary built in alpine.
  #
  # musl rather than glibc because cup resolves ftp.gnu.org and api.github.com to
  # discover compiler releases. glibc's getaddrinfo dlopen's NSS modules at
  # runtime, so a -static glibc binary fails DNS on any host whose glibc differs
  # from the build host's. musl's resolver is static-clean.
  #
  # alpine:3.23, not 3.22: 3.22 only carries GCC 14.2, and the floor is GCC 15
  # (see build-gcc15's comment above). 3.23 carries GCC 15.2.
  release-musl-static:
    name: alpine musl-static
    runs-on: ubuntu-24.04
    container: alpine:3.23

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        # Real ninja, not alpine's default samurai: samurai advertises ninja 1.9
        # compatibility and has no dyndep support, so CMake refuses to scan for
        # modules ("Ninja 1.11 or higher is required"). ninja-is-really-ninja
        # points the `ninja` command at ninja-build (and excludes samurai).
        # The *-static packages carry the archives a fully static link of libcurl
        # needs; pkgconf resolves them via libcurl.pc's Libs.private (see
        # third_party/CMakeLists.txt's CURL_USE_STATIC_LIBS branch).
        run: |
          apk add --no-cache \
            build-base cmake ninja-build ninja-is-really-ninja git pkgconf file \
            curl-dev curl-static \
            openssl-libs-static zlib-static nghttp2-static brotli-static \
            zstd-static libpsl-static libunistring-static libidn2-static

      - name: Show toolchain versions
        run: |
          g++ --version | head -1
          cmake --version | head -1
          # Must be >= 1.11, or module scanning is unavailable.
          ninja --version

      - name: Configure (Release, static)
        working-directory: cpp
        run: |
          # CURL_USE_STATIC_LIBS switches third_party/CMakeLists.txt onto
          # pkg-config's STATIC mode for libcurl (see the comment there) — plain
          # find_package(CURL) resolves the shared libcurl.so even with this
          # variable set, which fails "-static" linking.
          cmake -B build/Release \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static" \
            -DBUILD_SHARED_LIBS=OFF \
            -DCURL_USE_STATIC_LIBS=ON

      - name: Build
        working-directory: cpp
        run: cmake --build build/Release

      # Proves the "static" in musl-static. Until Phase 4 lands an executable
      # there is nothing to check, so an empty bin/ is not yet a failure.
      #
      # Checked via `file`, not `ldd`: musl/Alpine's toolchain defaults to
      # static-*pie* (position-independent) executables, and a PIE binary
      # carries an ELF interpreter entry (pointing at itself) regardless of
      # whether it's statically or dynamically linked — musl's ldd reports that
      # interpreter path either way, so "not a dynamic executable" never
      # matches a real static-pie cup binary even though it has zero NEEDED
      # entries (verified with `readelf -d`). `file`'s "static-pie linked" vs
      # "dynamically linked" distinction is the one that actually tracks it.
      - name: Verify the binary is static
        working-directory: cpp
        run: |
          if [ ! -f build/Release/bin/cup ]; then
            echo "no cup executable yet — skipping (expected until Phase 4)"
            exit 0
          fi
          file build/Release/bin/cup
          if file build/Release/bin/cup | grep -q 'dynamically linked'; then
            echo "ERROR: binary is dynamically linked"
            exit 1
          fi
          ./build/Release/bin/cup --help || true

      - name: Upload release binary
        if: hashFiles('cpp/build/Release/bin/cup') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cup-musl-static
          path: cpp/build/Release/bin/cup
