name: Release

# Tag-triggered publishing: push a `vX.Y.Z` tag and this builds the
# musl-static binary (via build-static.yml, the same reusable workflow
# cpp.yml calls on every push/PR) and attaches it to a GitHub Release.
#
# Deliberately no `paths:` filter — a release must build regardless of what
# the tagged commit touches, and path filters are not well-defined for tag
# pushes the way they are for branch pushes.

on:
  push:
    tags: ['v*']

jobs:
  build:
    uses: ./.github/workflows/build-static.yml
    permissions:
      contents: read

  publish:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download the static binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist

      # The artifact is uploaded as a bare `cup` file (see build-static.yml);
      # rename it so multiple platforms could one day sit in the same release
      # without colliding.
      - name: Rename for release
        run: mv dist/cup dist/cup-linux-x86_64-musl

      - name: Create GitHub Release
        # SHA-pinned, not @v2: this step runs with contents:write and
        # publishes the release, so it gets the same treatment as the
        # SonarCloud scan action in ci.yml — SonarCloud's githubactions:S7637
        # flags a floating tag on a step this sensitive as a vulnerability.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/cup-linux-x86_64-musl
          generate_release_notes: true
