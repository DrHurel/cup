name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/.local/share/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run tests with coverage
        run: go test -covermode=atomic -coverprofile=coverage.out ./...

      - name: Report coverage total
        run: go tool cover -func=coverage.out | tail -n 1

      - name: Generate HTML coverage report
        run: |
          mkdir -p site
          go tool cover -html=coverage.out -o site/index.html

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            site/index.html

      - name: Build executable
        run: |
          mkdir -p build
          go build -o build/cup .

  architecture:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26

      - name: Install go-arch-lint
        # Pinned to the immutable commit SHA of v1.16.0 for reproducible builds.
        run: go install github.com/fe3dback/go-arch-lint@828ca876e1f51496988116e9375c491f983a655c

      - name: Check architecture
        run: go-arch-lint check --project-path .

  sonarcloud:
    needs: test
    # Pinned rather than ubuntu-latest: this job configures the C++ port to
    # produce a compilation database, and that wants g++-15 (via the
    # ubuntu-toolchain-r PPA — noble's own archive tops out at g++-13) — the
    # same floor .github/workflows/cpp.yml builds against.
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    env:
      # Named modules require Ninja: CMake's Makefile generator does not
      # implement the dyndep scanning protocol modules need.
      CMAKE_GENERATOR: Ninja

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history gives SonarCloud accurate blame / new-code detection.
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage

      # --- C++ compilation database ---------------------------------------
      #
      # Without one the CFamily analyser skips the port outright, however much of
      # cpp/ sonar.sources covers: before this the project's language breakdown
      # was `go=3230;yaml=112`, with no C++ in it at all.
      #
      # This used to *configure* only, which was enough for the compilation
      # database. Phase 1.5 dropped `sonar.coverage.exclusions=cpp/**`, and
      # importing coverage means the tests have to actually run here — so the job
      # now configures, builds and tests the Coverage tree, and one build serves
      # both the database and the gcov data.
      #
      # cpp.yml still owns the *matrix* (GCC 15 floor, GCC 16 canary, musl-static);
      # this job builds one configuration purely to feed the scanner.
      #
      # The toolchain is installed here rather than carried in from cpp.yml
      # because CFamily runs the real compiler to learn its built-in macros and
      # include paths, and compile_commands.json names /usr/bin/g++-15 outright.
      - name: Install the C++ toolchain
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-15 ninja-build cmake libcurl4-openssl-dev gcovr

      # Keyed on the compiler too — see cpp.yml's floor job cache for why a
      # bare third_party/CMakeLists.txt hash isn't enough (mixed-GCC gcov
      # format mismatches on a floor bump).
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: cpp/build/Coverage/_deps
          key: ${{ runner.os }}-sonar-deps-gcc15-${{ hashFiles('cpp/third_party/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-sonar-deps-gcc15-

      # Must land on the path sonar.cfamily.compile-commands names.
      - name: Configure the C++ port
        working-directory: cpp
        env:
          CC: gcc-15
          CXX: g++-15
        run: cmake -B build/Coverage -DCMAKE_BUILD_TYPE=Coverage

      - name: Build the C++ port
        working-directory: cpp
        run: cmake --build build/Coverage

      # Produces the .gcda files gcovr reads. Without --no-tests=ignore, so a
      # suite that stops being discovered fails here instead of quietly reporting
      # zero coverage and failing the gate with a far less obvious message.
      - name: Test the C++ port
        working-directory: cpp
        run: ctest --test-dir build/Coverage --output-on-failure

      # Run from the repository root on purpose: --root decides the paths written
      # into the report, and Sonar keys C++ files as cpp/src/... . Rooting this at
      # cpp/ would emit src/... and match nothing, which shows up as 0% coverage
      # rather than as an error.
      #
      # gcov-15 must match the compiler; the default `gcov` is GCC 13 on this
      # runner and rejects the notes files. Vendored, generated and test sources
      # are excluded to match sonar.exclusions.
      #
      # The two --exclude-*-branches/lines flags are what make the imported
      # "conditions" mean what Sonar thinks they mean, and without them the gate
      # reads the port as barely covered:
      #
      #   - --exclude-throw-branches. gcov emits a branch pair for *every* call
      #     that could throw — the landing-pad edge — and the port's style is a
      #     dense chain of std::format, std::string and and_then/transform calls,
      #     so this dominates: 951 branches reported for cpp/src/libs, of which
      #     287 are exception edges no test can take without forcing bad_alloc.
      #     Sonar counts each as an uncovered condition, which is what put
      #     Toml.cpp at 60% branch coverage while 193 of its 197 real ones are
      #     covered.
      #   - --exclude-noncode-lines. Drops the lines that carry no statement of
      #     their own — a bare `}` whose only instructions are the destructor
      #     calls on an exception path, which gcov reports as an executable line
      #     with a zero count.
      #
      # Together they take coverage on new code from 78% to 98% without a single
      # test changing, so keep them: dropping them does not make the gate
      # stricter, it makes it measure the compiler's exception tables.
      #
      # --gcov-ignore-errors all, not just no_working_dir_found: any TU that
      # imports a named module gets a gcno note pointing at the module's BMI
      # name (e.g. "cup.error") instead of a real path — gcc/gcov has no
      # source file to open for that, so gcov reports it as source_not_found.
      # gcovr 7.0 (what apt installs on noble, and what this job pins via
      # g++-15/ninja-build/cmake/gcovr) treats an unignored gcov error as
      # fatal *for that whole translation unit* and drops the file from the
      # report outright, rather than degrading gracefully like 8.x does. That
      # silently deleted cpp/src/libs/cup/scaffold/{Cmake,Releases,Render}.cpp
      # from cpp/coverage.xml — Sonar then has zero coverage data for them, so
      # every new line in those files reads as uncovered. Measured on this
      # branch: new_coverage went from 59.3% (gate: fail, needs 80%) to 93.1%
      # once source_not_found was ignored too, with no test changes at all.
      - name: Generate the C++ coverage report
        run: |
          gcovr --root . \
                --gcov-executable gcov-15 \
                --gcov-exclude '.*/_deps/.*' \
                --gcov-ignore-errors all \
                --exclude '.*/_deps/.*' \
                --exclude '.*/generated/.*' \
                --exclude 'cpp/src/tests/.*' \
                --exclude-throw-branches \
                --exclude-noncode-lines \
                --sonarqube cpp/coverage.xml \
                cpp/build/Coverage
          echo "--- coverage.xml head ---"
          head -5 cpp/coverage.xml

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Block the check (and thus the merge) if the SonarCloud quality gate
          # fails on the analysed code. The no-new-issues policy is a condition
          # *on that gate* (new_violations > 0 is an error), not a second check
          # here — see the note in sonar-project.properties.
          args: >
            -Dsonar.qualitygate.wait=true

  deploy-pages:
    # Only publish the coverage site from the default branch.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
