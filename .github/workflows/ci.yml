name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/.local/share/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run tests with coverage
        run: go test -covermode=atomic -coverprofile=coverage.out ./...

      - name: Report coverage total
        run: go tool cover -func=coverage.out | tail -n 1

      - name: Generate HTML coverage report
        run: |
          mkdir -p site
          go tool cover -html=coverage.out -o site/index.html

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            site/index.html

      - name: Build executable
        run: |
          mkdir -p build
          go build -o build/cup .

  architecture:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26

      - name: Install go-arch-lint
        # Pinned to the immutable commit SHA of v1.16.0 for reproducible builds.
        run: go install github.com/fe3dback/go-arch-lint@828ca876e1f51496988116e9375c491f983a655c

      - name: Check architecture
        run: go-arch-lint check --project-path .

  sonarcloud:
    needs: test
    # Pinned rather than ubuntu-latest: this job configures the C++ port to
    # produce a compilation database, and that wants g++-14 from noble's archive
    # — the same floor .github/workflows/cpp.yml builds against.
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    env:
      # Named modules require Ninja: CMake's Makefile generator does not
      # implement the dyndep scanning protocol modules need.
      CMAKE_GENERATOR: Ninja

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history gives SonarCloud accurate blame / new-code detection.
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage

      # --- C++ compilation database ---------------------------------------
      #
      # Without one the CFamily analyser skips the port outright, however much of
      # cpp/ sonar.sources covers: before this the project's language breakdown
      # was `go=3230;yaml=112`, with no C++ in it at all.
      #
      # *Configure* only, no `cmake --build`. The analyser wants each translation
      # unit's compile flags and builds its own BMIs for the module units, so the
      # generate step is all it needs — and that keeps this job cheap and keeps a
      # broken C++ *build* out of the Go gate, which is cpp.yml's job to catch.
      #
      # The toolchain is installed here rather than carried in from cpp.yml
      # because CFamily runs the real compiler to learn its built-in macros and
      # include paths, and compile_commands.json names /usr/bin/g++-14 outright.
      - name: Install the C++ toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-14 ninja-build cmake libcurl4-openssl-dev

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: cpp/build/Debug/_deps
          key: ${{ runner.os }}-sonar-deps-${{ hashFiles('cpp/third_party/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-sonar-deps-

      # Must land on the path sonar.cfamily.compile-commands names.
      - name: Configure the C++ port
        working-directory: cpp
        env:
          CC: gcc-14
          CXX: g++-14
        run: cmake -B build/Debug -DCMAKE_BUILD_TYPE=Debug

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Block the check (and thus the merge) if the SonarCloud quality gate
          # fails on the analysed code. The no-new-issues policy is a condition
          # *on that gate* (new_violations > 0 is an error), not a second check
          # here — see the note in sonar-project.properties.
          args: >
            -Dsonar.qualitygate.wait=true

  deploy-pages:
    # Only publish the coverage site from the default branch.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
