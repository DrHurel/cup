name: Build static binary

# Reusable workflow: builds cup's musl-static release binary in alpine.
# Called from cpp.yml (continuous verification, every push/PR) and from
# release.yml (tag-triggered publishing) so the build steps exist in exactly
# one place.
#
# musl rather than glibc because cup resolves ftp.gnu.org and api.github.com to
# discover compiler releases. glibc's getaddrinfo dlopen's NSS modules at
# runtime, so a -static glibc binary fails DNS on any host whose glibc differs
# from the build host's. musl's resolver is static-clean.
#
# alpine:3.23, not 3.22: 3.22 only carries GCC 14.2, and the floor is GCC 15.
# 3.23 carries GCC 15.2.

on:
  workflow_call:
    outputs:
      artifact-name:
        description: Name of the uploaded build-tree artifact
        value: cup-musl-static

jobs:
  build:
    name: alpine musl-static
    runs-on: ubuntu-24.04
    container: alpine:3.23

    permissions:
      contents: read

    env:
      # Named modules require Ninja: CMake's Makefile generator does not
      # implement the dyndep scanning protocol modules need. A caller
      # workflow's own top-level `env:` does not propagate into a
      # `workflow_call`-triggered workflow, so this has to be set here too
      # rather than inherited from cpp.yml.
      CMAKE_GENERATOR: Ninja

    steps:
      - uses: actions/checkout@v4
        with:
          # This job never pushes back to the repo; leaving the checkout
          # token persisted in .git/config is an avoidable credential-
          # exposure surface (flagged by SonarCloud's githubactions:S8262 --
          # the build tree this job uploads is exactly the kind of broad
          # artifact that rule exists to catch).
          persist-credentials: false

      - name: Install toolchain
        # Real ninja, not alpine's default samurai: samurai advertises ninja 1.9
        # compatibility and has no dyndep support, so CMake refuses to scan for
        # modules ("Ninja 1.11 or higher is required"). ninja-is-really-ninja
        # points the `ninja` command at ninja-build (and excludes samurai).
        # The *-static packages carry the archives a fully static link of libcurl
        # needs; pkgconf resolves them via libcurl.pc's Libs.private (see
        # third_party/CMakeLists.txt's CURL_USE_STATIC_LIBS branch).
        run: |
          apk add --no-cache \
            build-base cmake ninja-build ninja-is-really-ninja git pkgconf file bats \
            curl-dev curl-static \
            openssl-libs-static zlib-static nghttp2-static brotli-static \
            zstd-static libpsl-static libunistring-static libidn2-static

      - name: Show toolchain versions
        run: |
          g++ --version | head -1
          cmake --version | head -1
          # Must be >= 1.11, or module scanning is unavailable.
          ninja --version

      # cmd_test.cpp and build_run.bats each have a scenario that chmod's a
      # directory to 0000 to simulate a permission-denied error and expects
      # the resulting cup operation to fail -- root bypasses permission
      # checks entirely, so those scenarios only mean anything running as an
      # ordinary user, same as every other job in this pipeline (GitHub's own
      # `runner` account on the non-containerized jobs). alpine:3.23 has no
      # such user by default and a `container:` job otherwise runs as root,
      # so this adds one and hands it the checked-out workspace; every step
      # below runs as that user.
      #
      # Deliberately `su runner -c '...'`, not `su -p`: -p (preserve-
      # environment) keeps root's HOME=/root instead of switching to
      # /home/runner, and running as runner-but-HOME=/root is worse than
      # either pure choice -- `cup` then can't write ~/.cache/cup/cup.log
      # (owned by root, not runner) and prints a warning on every invocation,
      # ahead of the real output, breaking anything matching stdout from the
      # first line (e.g. dispatch.bats' `cup --version` format check). A
      # plain `su runner -c` resets HOME correctly; GITHUB_SHA is computed
      # into a plain var first and CMAKE_GENERATOR is passed as an explicit
      # `-G Ninja` flag instead, since neither is guaranteed to survive a
      # non-preserving su into busybox's minimal environment.
      - name: Create a non-root build user
        run: |
          adduser -D runner
          chown -R runner:runner "$GITHUB_WORKSPACE"

      - name: Configure (Release, static)
        run: |
          # CURL_USE_STATIC_LIBS switches third_party/CMakeLists.txt onto
          # pkg-config's STATIC mode for libcurl (see the comment there) — plain
          # find_package(CURL) resolves the shared libcurl.so even with this
          # variable set, which fails "-static" linking.
          #
          # CUP_BUILD_SHA is baked into the binary and surfaced by
          # `cup --version` — this is the one build path (shared by CI
          # verification and actual releases) that sets it, which is what lets
          # `cup --version` distinguish a GitHub-built binary from a local
          # `cup build`/devtools/build.sh, where it's left empty.
          SHORT_SHA="${GITHUB_SHA::7}"
          su runner -c "cmake -B build/Release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS='-static' \
            -DBUILD_SHARED_LIBS=OFF \
            -DCURL_USE_STATIC_LIBS=ON \
            -DCUP_BUILD_SHA='$SHORT_SHA'"

      - name: Build
        run: su runner -c 'cmake --build build/Release'

      # Runs here, in-container, rather than in a separate downstream job
      # like Debug/Canary's unit-test-*/functional-test-* split: CTestTestfile.
      # cmake and friends bake in absolute paths from *this* configure, and a
      # `container:` job mounts the workspace at /__w/... instead of the
      # usual /home/runner/work/... -- a plain (non-containerized) test job
      # downloading this artifact would find every baked-in path broken.
      # Running the whole suite here, where the paths that were configured
      # are the paths that exist, sidesteps that entirely.
      - name: Test
        run: su runner -c 'ctest --test-dir build/Release --output-on-failure'

      # Checked via `file`, not `ldd`: musl/Alpine's toolchain defaults to
      # static-*pie* (position-independent) executables, and a PIE binary
      # carries an ELF interpreter entry (pointing at itself) regardless of
      # whether it's statically or dynamically linked — musl's ldd reports that
      # interpreter path either way, so "not a dynamic executable" never
      # matches a real static-pie cup binary even though it has zero NEEDED
      # entries (verified with `readelf -d`). `file`'s "static-pie linked" vs
      # "dynamically linked" distinction is the one that actually tracks it.
      - name: Verify the binary is static
        run: |
          file build/Release/bin/cup
          if file build/Release/bin/cup | grep -q 'dynamically linked'; then
            echo "ERROR: binary is dynamically linked"
            exit 1
          fi
          ./build/Release/bin/cup --help
          ./build/Release/bin/cup --version | grep -q "cup .* (${GITHUB_SHA::7})"

      # The full tree, not just the binary: release-main (cpp.yml) and
      # release.yml (tag-triggered publishing) both consume this same
      # artifact and only want the bare binary, picking it out at
      # dist/bin/cup after downloading -- uploading the whole tree here
      # rather than a separate minimal one keeps this job's output uniform
      # regardless of caller, even though only `bin/cup` actually gets used
      # downstream (Test, above, already ran against this same build).
      - name: Upload build tree
        uses: actions/upload-artifact@v4
        with:
          name: cup-musl-static
          path: |
            build/Release
            !build/Release/_deps
          include-hidden-files: true
          retention-days: 1
