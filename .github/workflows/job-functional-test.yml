name: Functional tests

# Reusable: downloads a build/<mode> tree (from job-build.yml or
# build-static.yml) and runs only the functional_* bats suites
# (src/tests/functional/*.bats), which drive the real compiled `cup` binary
# as a subprocess. Unlike the Catch2 suites job-unit-test.yml runs, several
# of these scenarios have `cup` itself orchestrate a *real* nested
# cmake+ninja(+bats) build of a scratch fixture project (see
# build_run.bats/modules_build_run.bats/make_build_run.bats) -- so, unlike
# unit tests, this job needs the full toolchain installed. gcc-version picks
# which g++ *this job* installs to run those nested builds -- independent of
# how the artifact's own `cup` binary was compiled (e.g. the musl-static
# Release build still runs its bats suites against a normal glibc g++-15
# here, since that only affects the fixture projects cup scaffolds and
# builds during the test, not cup itself).

on:
  workflow_call:
    inputs:
      mode:
        description: 'Build MODE whose artifact to test (Debug or Release) -- decides the download/ctest path, not which artifact'
        required: true
        type: string
      artifact-name:
        description: 'Name of the build-tree artifact to download and test (e.g. a job-build.yml or build-static.yml output)'
        required: true
        type: string
      gcc-version:
        description: 'GCC major version this job installs to compile fixture projects during the bats suites'
        required: false
        type: string
        default: '15'
      continue-on-error:
        description: 'Report failure without failing the overall run (for the gcc-16 canary)'
        required: false
        type: boolean
        default: false

env:
  CMAKE_GENERATOR: Ninja

jobs:
  test:
    name: functional tests (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    continue-on-error: ${{ inputs.continue-on-error }}

    permissions:
      contents: read

    # Job-level, not step-scoped: the "Run functional tests" step has the
    # already-built `cup` binary orchestrate *nested* cmake configures of
    # scratch fixture projects (see build_run.bats/modules_build_run.bats/
    # make_build_run.bats). Without CC/CXX reaching that nested invocation
    # too, it falls back to whatever `cc`/`c++` resolve to by default --
    # Ubuntu 24.04's system GCC 13, too old for the fixture's named-modules
    # code path even though g++-${{ inputs.gcc-version }} is right there on
    # PATH.
    env:
      CC: gcc-${{ inputs.gcc-version }}
      CXX: g++-${{ inputs.gcc-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Download build tree
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: build/${{ inputs.mode }}

      - name: Install toolchain
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-${{ inputs.gcc-version }} ninja-build cmake libcurl4-openssl-dev bats

      # actions/download-artifact does not restore the executable bit on its
      # own; the cup binary the bats suites exec needs it back.
      - name: Restore executable permissions
        run: chmod -R +x build/${{ inputs.mode }}/bin

      - name: Run functional tests
        run: ctest --test-dir build/${{ inputs.mode }} -R '^functional_' --output-on-failure
