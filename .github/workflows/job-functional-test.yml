name: Functional tests

# Reusable: downloads a build/<mode> tree (from job-build.yml or
# build-static.yml) and runs only the functional_* bats suites
# (src/tests/functional/*.bats), which drive the real compiled `cup` binary
# as a subprocess. Several of these scenarios have `cup` itself orchestrate a
# *real* nested cmake+ninja(+bats) build of a scratch fixture project (see
# build_run.bats/modules_build_run.bats/make_build_run.bats), so this job
# needs the full toolchain -- which `image` already carries, CC/CXX included,
# so those nested configures pick the image's GCC rather than a system default.
#
# Runs in `image`, the same job-ci-images.yml image the build job used: a
# `container:` job mounts the workspace at /__w/..., and every absolute path
# baked into CTestTestfile.cmake points there, so build and test must agree.

on:
  workflow_call:
    inputs:
      mode:
        description: 'Build MODE whose artifact to test (Debug or Release) -- decides the download/ctest path, not which artifact'
        required: true
        type: string
      artifact-name:
        description: 'Name of the build-tree artifact to download and test (e.g. a job-build.yml or build-static.yml output)'
        required: true
        type: string
      image:
        description: 'CI image to run in -- the one the build job used (a job-ci-images.yml output)'
        required: true
        type: string
      continue-on-error:
        description: 'Report failure without failing the overall run (for the gcc-16 canary)'
        required: false
        type: boolean
        default: false

jobs:
  test:
    name: functional tests (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    continue-on-error: ${{ inputs.continue-on-error }}

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4
        with:
          # This job never pushes back to the repo; no reason to leave the
          # checkout token persisted in .git/config.
          persist-credentials: false

      - name: Download build tree
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: build/${{ inputs.mode }}

      # actions/download-artifact does not restore the executable bit; the cup
      # binary the bats suites exec needs it back.
      #
      # build_run.bats has a scenario that chmod's a directory to 0000 to
      # simulate a permission-denied error and expects the resulting cup
      # operation to fail -- root bypasses permission checks entirely, and a
      # `container:` job runs as root. The image carries an ordinary `runner`
      # user; hand it the workspace and run the suites as that user (su keeps
      # the image's CC/CXX/CMAKE_GENERATOR).
      - name: Prepare the workspace for the non-root user
        run: |
          chmod -R +x build/${{ inputs.mode }}/bin
          chown -R runner:runner "$GITHUB_WORKSPACE"

      - name: Run functional tests
        run: su runner -c "ctest --test-dir build/${{ inputs.mode }} -R '^functional_' --output-on-failure"
