name: Deploy coverage site

# Reusable: publishes the gcovr HTML report job-sonarcloud.yml generated to
# GitHub Pages. The call site (cpp.yml) restricts this to pushes on main —
# a PR's coverage is worth generating (SonarCloud reads it) but not worth
# publishing over the current site.

on:
  workflow_call: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
