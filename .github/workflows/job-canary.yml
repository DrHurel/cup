name: Canary (gcc-16)

# Reusable, non-blocking: early warning against a newer GCC. Module support
# moves fast, and an ICE or a stale-BMI bug should surface here rather than
# in a contributor's first PR. This job exists to tell us something, not to
# gate — continue-on-error is set at the call site (cpp.yml).

on:
  workflow_call: {}

env:
  CMAKE_GENERATOR: Ninja

jobs:
  build-and-test:
    name: gcc-16 (canary) — build + test
    runs-on: ubuntu-24.04
    # continue-on-error belongs here, not on the caller job in cpp.yml: a
    # job that calls a reusable workflow via `uses:` can't set it directly
    # (actionlint: "only following keys are allowed ..."), and this is also
    # the more precise place for it -- GitHub still shows this job's own
    # conclusion, marked non-blocking, nested under cpp.yml's "canary" entry.
    continue-on-error: true

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-16 ninja-build cmake libcurl4-openssl-dev bats

      - name: Configure
        env:
          CC: gcc-16
          CXX: g++-16
        run: cmake -B build/Debug -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/Debug

      - name: Test
        run: ctest --test-dir build/Debug --output-on-failure
