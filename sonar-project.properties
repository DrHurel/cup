sonar.host.url=https://sonarcloud.io
sonar.organization=drhurel-1
sonar.projectKey=DrHurel_cup
sonar.projectName=cup

# --- Quality gate ---
#
# The gate itself lives in SonarCloud, not here — a scanner property cannot set
# one — and ci.yml blocks the merge on it with sonar.qualitygate.wait=true.
#
# The no-new-issues policy is the `new_violations > 0 is an error` condition on
# it. It is worth spelling out that this is deliberate and separate from the
# stock "Sonar way" conditions: those are *ratings* on new code (reliability,
# security and maintainability must stay A), and a new minor code smell leaves
# maintainability at A — green gate, issue merged. new_violations is what makes
# the rule literal.
#
# Sonar way is built-in and read-only, so the project is on a copy of it with
# that one condition added. Manage it under
# https://sonarcloud.io/organizations/drhurel-1/quality_gates.

# Source layout
#
# The build-output and generated-tooling exclusions are `**/`-anchored on purpose:
# a bare `build/**` is resolved against the project base directory, so it matches
# only the top-level build/ (devtools/build.sh's output) and silently lets
# cpp/build/ through — which, once the C++ port is analysed (below), means
# ~100 vendored Catch2 translation units and the generated embedded-template
# source.
sonar.sources=.
sonar.exclusions=cpp/src/tests/**,**/build/**,devtools/**,**/docker/**
sonar.tests=.
sonar.test.inclusions=cpp/src/tests/**

# --- The C++23 port under cpp/ ---
#
# sonar.sources has always covered cpp/, but that alone analysed none of it:
# CFamily needs a compilation database or it skips the language entirely, and the
# project's ncloc_language_distribution read `go=3230;yaml=112` — no C++ at all.
#
# The database comes from a plain `cmake -B cpp/build/Coverage` (the top-level
# CMakeLists sets CMAKE_EXPORT_COMPILE_COMMANDS).
#
# It names the Coverage tree, not Debug, because that tree now has to exist and be
# *built* anyway for the coverage import above — one configure and one build serve
# both inputs. The extra `-O0 -g --coverage` in each entry does not affect the
# analysis; CFamily reads the flags for include paths and macros.
#
# The consequence is worth stating: the scan job no longer merely configures the
# port, it compiles and tests it, so a broken C++ build now fails this job too
# rather than only .github/workflows/cpp.yml. That is the price of gating on C++
# coverage, and it is why cpp.yml keeps its own build — it is the one that reports
# *which* toolchain broke.
sonar.cfamily.compile-commands=cpp/build/Coverage/compile_commands.json

# cup's sources are C++23 named modules, and CFamily's module support is
# experimental and off by default. Without this every `.cppm` is analysed with its
# `import` declarations unresolved.
#
# No sonar.cpp.file.suffixes override is needed: the SonarCloud instance default
# already carries the module extensions
# (.cc .cpp .cxx .c++ .hh .hpp .hxx .h++ .ipp .ixx .mxx .cppm .ccm .cxxm .c++m).
sonar.cfamily.enableModules=true

# C++ coverage (Phase 1.5 of docs/migration-cpp23.md).
#
# The port used to sit behind `sonar.coverage.exclusions=cpp/**`, because its
# report was produced by a separate workflow this scan could not see. Phase 2
# landed the first Catch2 suites, so ci.yml now runs the Coverage build itself and
# converts its gcov data with `gcovr --sonarqube` — and the exclusion is gone.
#
# sonar.coverageReportPaths (the generic coverage format) rather than
# sonar.cfamily.gcov.reportsPath: the latter wants a directory of raw .gcov files,
# one `gcov --preserve-paths` run per object file, whereas gcovr emits the one XML
# Sonar reads. It is also what SonarSource's own CMake example uses.
#
# The paths inside the XML must match the ones Sonar keys files by, so ci.yml runs
# gcovr with --root at the *repository* root: rooting it at cpp/ would emit
# src/libs/... and silently match nothing.
sonar.coverageReportPaths=cpp/coverage.xml

# cup generates docker/<name>/Dockerfile as a *build* image: it apt-installs the
# project's dependencies and compiles a bind-mounted workspace, so it runs as root
# deliberately, and `cup docker build` rewrites the file (an inline NOSONAR would
# not survive). Suppress the default-root rule for those generated images only.
#
# Other documented-but-unfixable findings (write_callback's libcurl-mandated
# signature, Config.cppm's operator==s that would segfault g++-15 if defaulted)
# are accepted per-issue on SonarCloud instead of ignored here — a project-wide
# rule ignore would also swallow any future, real instance of the same rule.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e1.resourceKey=**/docker/*/Dockerfile

sonar.sourceEncoding=UTF-8
