sonar.host.url=https://sonarcloud.io
sonar.organization=drhurel-1
sonar.projectKey=DrHurel_cup
sonar.projectName=cup

# --- Quality gate ---
#
# The gate itself lives in SonarCloud, not here — a scanner property cannot set
# one — and ci.yml blocks the merge on it with sonar.qualitygate.wait=true.
#
# The no-new-issues policy is the `new_violations > 0 is an error` condition on
# it. It is worth spelling out that this is deliberate and separate from the
# stock "Sonar way" conditions: those are *ratings* on new code (reliability,
# security and maintainability must stay A), and a new minor code smell leaves
# maintainability at A — green gate, issue merged. new_violations is what makes
# the rule literal.
#
# Sonar way is built-in and read-only, so the project is on a copy of it with
# that one condition added. Manage it under
# https://sonarcloud.io/organizations/drhurel-1/quality_gates.

# Source layout
#
# The build-output and generated-tooling exclusions are `**/`-anchored on purpose:
# a bare `build/**` is resolved against the project base directory, so it matched
# the Go build/ and silently let cpp/build/ through — which, once the C++ port is
# analysed (below), means ~100 vendored Catch2 translation units and the generated
# embedded-template source.
sonar.sources=.
sonar.exclusions=**/*_test.go,cpp/src/tests/**,**/build/**,devtools/**,**/docker/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go,cpp/src/tests/**

# Go coverage (produced by `go test -coverprofile=coverage.out`)
sonar.go.coverage.reportPaths=coverage.out

# --- The C++23 port under cpp/ ---
#
# sonar.sources has always covered cpp/, but that alone analysed none of it:
# CFamily needs a compilation database or it skips the language entirely, and the
# project's ncloc_language_distribution read `go=3230;yaml=112` — no C++ at all.
#
# The database comes from a plain `cmake -B cpp/build/Debug` (the top-level
# CMakeLists sets CMAKE_EXPORT_COMPILE_COMMANDS). *Configuring* is enough — no
# `cmake --build` — because the analyser only wants each translation unit's
# compile flags and builds its own BMIs for the module units. ci.yml therefore
# configures the port in the scan job, which also keeps a broken C++ *build* from
# blocking the Go gate; .github/workflows/cpp.yml owns the build.
#
# The path doubles as the one a contributor already has: it is the build tree
# .vscode/c_cpp_properties.json points IntelliSense at.
sonar.cfamily.compile-commands=cpp/build/Debug/compile_commands.json

# cup's sources are C++23 named modules, and CFamily's module support is
# experimental and off by default. Without this every `.cppm` is analysed with its
# `import` declarations unresolved.
#
# No sonar.cpp.file.suffixes override is needed: the SonarCloud instance default
# already carries the module extensions
# (.cc .cpp .cxx .c++ .hh .hpp .hxx .h++ .ipp .ixx .mxx .cppm .ccm .cxxm .c++m).
sonar.cfamily.enableModules=true

# The port is analysed for issues but left out of the coverage metric: its
# gcov/lcov report is produced by a separate workflow (.github/workflows/cpp.yml),
# so this scan cannot see it, and counting the whole port as uncovered new code
# fails the gate on every migration PR. Importing it — gcov reports into
# sonar.cfamily — is Phase 1.5 of docs/migration-cpp23.md; drop this line then.
sonar.coverage.exclusions=cpp/**

# cup generates docker/<name>/Dockerfile as a *build* image: it apt-installs the
# project's dependencies and compiles a bind-mounted workspace, so it runs as root
# deliberately, and `cup docker build` rewrites the file (an inline NOSONAR would
# not survive). Suppress the default-root rule for those generated images only.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e1.resourceKey=**/docker/*/Dockerfile

sonar.sourceEncoding=UTF-8
