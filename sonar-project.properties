sonar.host.url=https://sonarcloud.io
sonar.organization=drhurel-1
sonar.projectKey=DrHurel_cup
sonar.projectName=cup

# Source layout
sonar.sources=.
sonar.exclusions=**/*_test.go,build/**,devtools/**,docker/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Go coverage (produced by `go test -coverprofile=coverage.out`)
sonar.go.coverage.reportPaths=coverage.out

# The C++ port under cpp/ is analysed for issues but left out of the coverage
# metric: its gcov/lcov report is produced by a separate workflow
# (.github/workflows/cpp.yml), so this scan cannot see it, and counting the whole
# port as uncovered new code fails the gate on every migration PR. Importing it —
# gcov reports into sonar.cfamily — is Phase 1.5 of docs/migration-cpp23.md; drop
# this line then.
sonar.coverage.exclusions=cpp/**

# cup generates docker/<name>/Dockerfile as a *build* image: it apt-installs the
# project's dependencies and compiles a bind-mounted workspace, so it runs as root
# deliberately, and `cup docker build` rewrites the file (an inline NOSONAR would
# not survive). Suppress the default-root rule for those generated images only.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e1.resourceKey=**/docker/*/Dockerfile

sonar.sourceEncoding=UTF-8
